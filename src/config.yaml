# ============================================================
# Configuration for the final_test regression pipeline
# All paths are relative to the project root (where main.py is)
# ============================================================

data:
  file_path: data/data.csv
  target: final_test

# ---------- Data cleaning ----------
cleaning:
  # Fix inconsistent labels
  tuition_mapping:
    "Y": "Yes"
    "N": "No"
  cca_fill_value: "None"          # students with no CCA recorded
  age_mapping:                    # typos: 5 -> 15, 6 -> 16
    5: 15
    6: 16
  # Rows missing any of these are dropped
  dropna_columns:
    - final_test                  # the target: can't train or test without it
  min_age: 0                      # drop rows with age <= min_age
  # Missing values in these columns are kept and filled with the TRAINING-set median after the split
  median_fill_columns:
    - attendance_rate             # ~5% missing; median (95) used because attendance is skewed towards 100

# ---------- Feature engineering ----------
features:
  study_band:
    bins: [-1, 4, 10, 100]        # score peaks at 5-10 hrs per week
    labels: ["0-4 hrs", "5-10 hrs", "11+ hrs"]
  low_attendance_threshold: 80    # attendance_rate <= 80  -> low_attendance = 1
  enough_sleep_threshold: 7       # sleep_hours >= 7       -> enough_sleep = 1

  # Columns fed to the model
  numerical_features:             # scaled with StandardScaler
    - class_size
    - attendance_rate
    - sleep_hours
    - low_attendance
    - enough_sleep
  nominal_features:               # one-hot encoded
    - CCA
    - learning_style
    - tuition
    - direct_admission
    - study_band
    - number_of_siblings

# ---------- Train / test split ----------
split:
  test_size: 0.2                  # 80% train / 20% test
  random_state: 42

# ---------- Model: Random forest tuned with RandomizedSearchCV ----------
model:
  random_state: 42                # makes the forest reproducible
  random_search:
    n_iter: 20                    # number of random setting combinations to try
    cv: 5                         # k-fold cross-validation on the training set
    scoring: r2
    random_state: 42
    n_jobs: -1                    # use all CPU cores
  param_distributions:            # the search picks one value from each list
    n_estimators: [100, 200, 300]       # number of trees
    max_depth: [null, 10, 15, 20]       # how deep each tree can grow (null = no limit)
    min_samples_leaf: [1, 2, 5, 10]     # smallest group of students a leaf can hold
    max_features: ["sqrt", 0.5, 1.0]    # share of features each split can look at

# ---------- Outputs saved after training ----------
output:
  dir: outputs                    # model, metrics, predictions and run record are saved here
